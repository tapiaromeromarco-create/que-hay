<style>html,body{margin:0;padding:0}
#hola{position:fixed;inset:0;z-index:9999;background:#FFF3DC;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px;text-align:center;font-family:Fredoka,Nunito,sans-serif;color:#183A27;transition:opacity .45s ease,transform .45s ease;cursor:pointer}
#hola.fuera{opacity:0;transform:scale(1.04);pointer-events:none}
#hola img{width:min(58vw,240px);height:auto;animation:asoma .9s cubic-bezier(.3,1.5,.5,1) both}
#hola .hey{font-size:15px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#D9472B;margin-top:14px;animation:sube .5s .7s ease-out both}
#hola h1{font-size:27px;font-weight:600;margin:0;animation:sube .5s .85s ease-out both}
#hola p{font-family:Nunito,sans-serif;font-size:16px;margin:2px 0 0;opacity:.8;animation:sube .5s 1s ease-out both}
#hola button{margin-top:26px;font:600 17px Fredoka,Nunito,sans-serif;color:#FFF3DC;background:#D9472B;border:0;border-radius:999px;padding:14px 34px;box-shadow:0 4px 0 #A8341D;animation:sube .5s 1.4s ease-out both;cursor:pointer}
#hola button:active{transform:translateY(3px);box-shadow:0 1px 0 #A8341D}
#hola small{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));font-family:Nunito,sans-serif;font-size:12px;opacity:.55;animation:sube .5s 1.6s ease-out both}
@keyframes asoma{0%{opacity:0;transform:translateY(30px) scale(.7) rotate(-6deg)}100%{opacity:1;transform:none}}
@keyframes sube{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#hola *{animation:none!important}}

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: una app de celular; en escritorio se muestra dentro de un teléfono. Estilo del logo: contorno verde grueso + sombra dura. */
:root{
  --verde:#264F3A; --hoja:#477556; --jit:#D14726; --crema:#FFF3DC; --papel:#FFFBF2; --tinta:#1F2A24;
  --suave:#5B5848; --linea:#E6D9BD; --mostaza:#E9A23B; --fondo:#E8DDC6; --mejilla:#F08A6E;
  --display:'Fredoka','Nunito',system-ui,sans-serif;
  --texto:'Nunito',system-ui,sans-serif;
  --mono:'Courier Prime','Courier New',monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font:500 16px/1.5 var(--texto);display:flex;justify-content:center;align-items:center;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button,.carta,.fila{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--mostaza);outline-offset:2px}
.tel{position:relative;width:100%;height:100%;max-width:420px;background:var(--crema);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:640px) and (min-height:760px){
  .tel{height:min(860px,100% - 32px);border:3px solid var(--verde);border-radius:36px;box-shadow:8px 8px 0 var(--verde)}
}
header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px;gap:12px}
.marca{display:flex;align-items:center;gap:8px}
.marca svg{height:40px;width:auto}
.casa-tag{font:600 12px var(--texto);color:var(--verde);background:var(--papel);border:2px solid var(--verde);border-radius:999px;padding:4px 10px}
main{flex:1;overflow-y:auto;padding:4px 18px 24px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
/* Desvanecido ligero al bajar: degradados encima (no máscara), para que las animaciones no se traben en el iPhone */
header.top{position:relative;z-index:3}
header.top::after{content:"";position:absolute;left:0;right:0;top:100%;height:30px;background:linear-gradient(var(--crema),rgba(255,243,220,0));pointer-events:none;opacity:0;transition:opacity .2s}
.tel.bajo header.top::after{opacity:1}
h1,h2,h3{font-family:var(--display);font-weight:700;color:var(--verde);margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.1}
h2{font-size:22px;line-height:1.15}
h3{font-size:18px;line-height:1.2}
.sub{color:var(--suave);margin:6px 0 16px;font-size:15px}
.eyebrow{font:600 18px var(--display);color:var(--verde);margin:26px 0 10px}
.stack{display:flex;flex-direction:column;gap:10px}
.sticker{background:var(--papel);border:2px solid var(--verde);border-radius:18px;box-shadow:3px 3px 0 var(--verde)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:2px solid var(--verde);border-radius:999px;padding:13px 18px;
  font:600 15px var(--texto);background:var(--jit);color:var(--papel);box-shadow:3px 3px 0 var(--verde);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--verde)}
.btn.verde{background:var(--verde)}
.btn.claro{background:var(--papel);color:var(--verde)}
.btn svg{width:20px;height:20px}
.link{background:none;border:0;color:var(--verde);font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:8px}

/* Imanes */
.imanes{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;margin-top:8px}
.iman{background:none;border:0;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:8px}
.iman .disco{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--verde);box-shadow:4px 4px 0 var(--verde);
  position:relative;transition:transform .12s}
.iman .disco::after{content:"";position:absolute;inset:7px;border-radius:50%;border:2px dashed rgba(255,251,242,.6)}
.iman:active .disco{transform:scale(.95)}
.iman .disco svg{width:44px;height:44px}
.iman b{font:700 18px var(--display);color:var(--verde)}
.iman span{font-size:13px;color:var(--suave);margin-top:-6px;text-align:center;line-height:1.3}

/* Listas */
.fila{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1.5px dashed var(--linea)}
.fila:last-child{border-bottom:0}
.fila .nom{flex:1;min-width:0}
.fila .nom b{display:block;font-weight:600}
.fila .nom small{color:var(--suave)}
.punto{width:12px;height:12px;border-radius:50%;flex:none;border:2px solid var(--verde)}
.mini{border:2px solid var(--verde);background:var(--papel);border-radius:999px;padding:5px 12px;font:600 12px var(--texto);color:var(--verde);white-space:nowrap}
.mini.rojo{background:var(--jit);color:var(--papel)}
.grupo{padding:4px 14px;margin-bottom:12px}
.refri-dentro{position:relative;margin-top:6px;padding:22px 12px 12px;border-radius:26px;border:2.5px solid var(--verde);
  background:radial-gradient(120% 60% at 50% 0,#FFFFFF 0,#EEF8F2 45%,#E2F2E8 100%);box-shadow:4px 4px 0 var(--verde),inset 0 0 0 6px #F7FCF9}
.refri-dentro .foco{position:absolute;top:8px;left:50%;width:70px;height:8px;margin-left:-35px;border-radius:8px;background:#fff;box-shadow:0 0 18px 6px rgba(255,255,255,.95),0 0 40px 14px rgba(205,232,215,.8)}
.refri-dentro .eyebrow{margin:8px 4px 8px;font-size:16px}
.refri-dentro .grupo{background:rgba(255,255,255,.75);border-color:rgba(38,79,58,.35);box-shadow:none;margin-bottom:0}
.refri-dentro .desliza .fila{background:rgba(255,255,255,.92)}
.refri-dentro .repisa-refri::after{content:"";display:block;height:9px;margin:14px -4px 6px;border-radius:5px;background:linear-gradient(#FFFFFF,#D4ECDD);border:1.5px solid rgba(38,79,58,.22);box-shadow:0 6px 8px -4px rgba(38,79,58,.25)}
.refri-dentro .repisa-verdura{position:relative;margin-top:4px;padding:14px 10px 10px;border-radius:16px;background:rgba(189,229,208,.45);border:1.5px solid rgba(38,79,58,.25)}
.refri-dentro .repisa-verdura::before{content:"";position:absolute;top:6px;left:50%;width:54px;height:6px;margin-left:-27px;border-radius:6px;background:rgba(38,79,58,.35)}
.alacena-mueble{margin-top:18px}
.alacena-mueble .grupo{margin-bottom:0}
.alacena-mueble::after{content:"";display:block;height:12px;margin:10px 6px 0;border-radius:4px;background:var(--mostaza);box-shadow:0 4px 0 #B97A1F}
.al-refri{position:absolute;inset:0;z-index:45;background:rgba(255,243,220,.93);display:grid;place-items:center;align-content:center;gap:18px}
.ra-escena{perspective:700px}
.ra-refri{position:relative;width:132px;height:196px;border-radius:20px;background:#264F3A;padding:7px;will-change:transform}
.ra-dentro{position:absolute;inset:7px;border-radius:14px;background:radial-gradient(110% 55% at 50% 0,#fff 0,#EAF6EF 50%,#DCEFE4 100%);overflow:hidden}
.ra-foco{position:absolute;top:6px;left:50%;width:44px;height:6px;margin-left:-22px;border-radius:6px;background:#fff;box-shadow:0 0 14px 5px rgba(255,255,255,.9)}
.ra-rep{position:absolute;left:8px;right:8px;top:34%;height:5px;border-radius:3px;background:#fff;box-shadow:0 0 0 1.5px #A9D2B9}
.ra-rep.b{top:60%}
.ra-cajon{position:absolute;left:10px;right:10px;bottom:8px;height:22%;border-radius:8px;background:#CDE8D7;box-shadow:0 0 0 1.5px #A9D2B9}
.ra-puerta{position:absolute;inset:0;border-radius:20px;background:#FFF3DC;border:5px solid #264F3A;transform-origin:0 50%;backface-visibility:visible;will-change:transform;
  background-image:linear-gradient(#264F3A,#264F3A);background-size:100% 4px;background-position:0 34%;background-repeat:no-repeat}
.ra-jal{position:absolute;right:10px;top:12%;width:6px;height:16%;border-radius:4px;background:#264F3A}
.ra-jal.b{top:42%;height:26%}
.ticket.ticket-vuela{position:absolute;z-index:46;margin:0;transform-origin:50% 50%;pointer-events:none;filter:none!important;will-change:transform,opacity;box-shadow:0 10px 24px rgba(31,42,36,.18)}
.guardado{margin:0;text-align:center;font:700 22px var(--display);color:var(--verde);opacity:0;transform:translateY(10px);transition:opacity .35s ease,transform .45s cubic-bezier(.34,1.56,.64,1)}
.guardado small{display:block;font:600 14px var(--texto);color:var(--suave)}
.guardado.ver{opacity:1;transform:none}
.tabs{display:flex;gap:8px;margin:4px 0 14px}
.tab{flex:1;border:2px solid var(--verde);background:var(--papel);border-radius:999px;padding:9px;font:600 14px var(--texto);color:var(--verde)}
.tab[aria-selected="true"]{background:var(--verde);color:var(--papel)}
.agregar{display:flex;gap:8px;margin:6px 0 14px}
.agregar input{flex:1;min-width:0;border:2px solid var(--verde);border-radius:999px;padding:10px 14px;background:var(--papel)}
.agregar button{flex:none;width:auto;padding:10px 16px}

/* Avisos */
.aviso{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;border-bottom:1.5px dashed var(--linea)}
.ava{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 16px var(--display);color:var(--papel);border:2px solid var(--verde)}
.aviso p{margin:0}
.aviso small{color:var(--suave)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Recetas */
.receta{padding:14px;text-align:left;width:100%;display:flex;flex-direction:column;gap:8px}
.receta .cab{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.receta .t{font-size:12px;color:var(--suave);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 12px var(--texto);border-radius:999px;padding:2px 10px;border:1.5px solid var(--verde);color:var(--verde);background:var(--crema)}
.chip.falta{border-style:dashed;border-color:var(--jit);color:var(--jit);background:transparent}
.estado{font:800 13px var(--texto)}
.estado.ok{color:var(--hoja)} .estado.no{color:var(--jit)}

/* Ticket */
.ticket{background:#fff;font-family:var(--texto);font-size:15px;color:var(--tinta);padding:24px 18px 22px;position:relative;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%,
               conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%;
  -webkit-mask-composite:source-in;mask-composite:intersect;filter:drop-shadow(3px 3px 0 var(--verde))}
.ticket .c{text-align:center}
.ticket hr{border:0;border-top:2px dashed #CFC8B8;margin:12px 0 4px}
.tcab{text-align:center;display:flex;flex-direction:column;gap:2px}
.tcab b{font:700 20px var(--display);color:var(--verde);letter-spacing:.5px}
.tcab span{font:600 13px var(--texto);color:var(--suave)}
.ttotal{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0 2px}
.ttotal span{font:700 17px var(--display);color:var(--verde)}
.ttotal b{font:700 26px var(--display);color:var(--jit);font-variant-numeric:tabular-nums}
.tpie{text-align:center;font:400 12px var(--mono);color:#8a8a8a;margin-top:8px}
.titem{display:flex;gap:10px;align-items:center;padding:10px 0;width:100%;background:none;border:0;border-bottom:1.5px dashed #ECE6D8;font:inherit;text-align:left}
.titem .n{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.titem .nom{font-weight:700;font-size:16px;line-height:1.25}
.titem .cant{font:700 12px var(--texto);color:var(--hoja);background:#EAF2EC;border-radius:999px;padding:2px 8px}
.titem .precio{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.titem.off{color:#aaa}
.titem.off .nom{text-decoration:line-through}
.titem.off .cant{background:#f1f1f1;color:#aaa}
.titem .x{width:28px;height:28px;border-radius:50%;border:2px solid var(--hoja);flex:none;display:grid;place-items:center;font:800 15px var(--texto);line-height:1;color:#fff;padding:0}
.titem:not(.off) .x{background:var(--hoja)!important}
.ticket input{font:600 15px var(--texto);border:0;border-bottom:2px dashed #CFC8B8;padding:10px 0 6px;width:100%;background:transparent;color:var(--tinta)}

/* Cámara */
.visor{aspect-ratio:3/4;max-width:100%;border-radius:22px;border:3px solid var(--verde);background:var(--tinta);position:relative;overflow:hidden;display:grid;place-items:center;box-shadow:4px 4px 0 var(--verde)}
.visor img{width:100%;height:100%;object-fit:cover}
.visor .guia{position:absolute;inset:18px;border:2.5px dashed rgba(255,243,220,.7);border-radius:14px}
.visor p{color:var(--crema);position:absolute;bottom:26px;margin:0;font-size:13px;text-align:center;left:20px;right:20px}
.visor .scan{position:absolute;inset:16px;border-radius:14px;overflow:hidden;pointer-events:none}
.visor .scan::before{content:"";position:absolute;left:0;right:0;top:0;height:28%;background:linear-gradient(to bottom,rgba(245,192,99,0) 0%,rgba(245,192,99,.10) 55%,rgba(245,192,99,.42) 100%);border-bottom:2.5px solid #FFD98A;box-shadow:0 6px 22px 2px rgba(245,192,99,.55);transform:translateY(-100%);animation:barrido 2.2s cubic-bezier(.45,.05,.35,1) infinite;will-change:transform,opacity}
@keyframes barrido{0%{transform:translateY(-100%);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateY(360%);opacity:0}}
.visor .esquinas{position:absolute;inset:16px;pointer-events:none;--c:#FFD98A;
  background:linear-gradient(var(--c),var(--c)) top left/28px 3px,linear-gradient(var(--c),var(--c)) top left/3px 28px,
             linear-gradient(var(--c),var(--c)) top right/28px 3px,linear-gradient(var(--c),var(--c)) top right/3px 28px,
             linear-gradient(var(--c),var(--c)) bottom left/28px 3px,linear-gradient(var(--c),var(--c)) bottom left/3px 28px,
             linear-gradient(var(--c),var(--c)) bottom right/28px 3px,linear-gradient(var(--c),var(--c)) bottom right/3px 28px;
  background-repeat:no-repeat;animation:enfoca 2.2s ease-in-out infinite}
@keyframes enfoca{0%,100%{inset:16px;opacity:.75}50%{inset:22px;opacity:1}}
.visor:has(.scan) img{animation:acercar 7s ease-in-out infinite alternate;filter:saturate(.9) brightness(.9)}
@keyframes acercar{to{transform:scale(1.06)}}
.visor .icono-cam{width:64px;height:64px;opacity:.9}

/* Nav */
nav{display:flex;align-items:flex-end;background:var(--papel);border-top:2px solid var(--verde);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font:700 12px var(--texto);color:var(--suave);padding:4px 0}
nav button svg{width:26px;height:26px}
nav button[aria-current="page"]{color:var(--verde);font-weight:700}
nav .centro .bola{width:58px;height:58px;margin-top:-26px;border-radius:50%;background:var(--jit);border:3px solid var(--verde);box-shadow:3px 3px 0 var(--verde);display:grid;place-items:center}
nav .centro .bola svg{width:30px;height:30px}

/* NFC overlay */
.nfc{position:absolute;inset:0;background:rgba(31,42,36,.55);display:grid;place-items:center;z-index:20}
.nfc .caja{background:var(--crema);border:3px solid var(--verde);border-radius:26px;box-shadow:5px 5px 0 var(--verde);padding:26px 22px;width:78%;text-align:center}
.nfc .escena{height:120px;position:relative;margin-bottom:10px}
.nfc .escena .disco{width:84px;height:84px;border-radius:50%;border:3px solid var(--verde);position:absolute;left:50%;bottom:4px;transform:translateX(-50%);display:grid;place-items:center}
.nfc .escena .disco svg{width:38px;height:38px}
.nfc .escena .cel{position:absolute;left:50%;width:44px;height:74px;border:3px solid var(--verde);border-radius:10px;background:var(--papel);transform:translateX(-50%);top:-10px;animation:acerca 1s ease-in-out forwards}
.nfc .escena .cel::after{content:"";position:absolute;left:12px;right:12px;bottom:6px;height:3px;border-radius:2px;background:var(--verde)}
@keyframes acerca{to{top:22px}}
.sheet{position:absolute;inset:auto 0 0;background:var(--crema);border-top:3px solid var(--verde);border-radius:26px 26px 0 0;max-height:86%;overflow-y:auto;z-index:15;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.velo{position:absolute;inset:0;background:rgba(31,42,36,.45);z-index:14}
.toast{position:absolute;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top,0px));background:var(--verde);color:var(--papel);border-radius:16px;padding:12px 16px;font-weight:500;z-index:30;
  box-shadow:3px 3px 0 var(--tinta);transform:translateY(-140%);transition:transform .3s}
.toast.ver{transform:none}
.vacio{text-align:center;color:var(--suave);padding:24px 8px}
.nota{font-size:12px;color:var(--suave);text-align:center;margin-top:10px}
/* Mascota: el jitomate del logo */
.masc{display:block;overflow:hidden}
.masc.disfraz{overflow:visible}
.con-chef{position:relative;padding-right:80px;min-height:84px;display:flex;align-items:flex-end}
.con-chef .masc{position:absolute;right:8px;top:2px;width:58px;transform:rotate(6deg)}
.nfc .masc.mesero{width:104px;right:-14px}
.toast .masc.mesero{width:46px}
.masc .cuerpo{animation:flotar 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.masc.feliz .cuerpo,.masc.fiesta .cuerpo{animation:brinco .9s ease-in-out infinite}
.masc.sorpresa .cuerpo{animation:sacude .45s ease-in-out 3}
.masc.lee .cuerpo{animation:leer 1.1s ease-in-out infinite alternate}
@keyframes flotar{0%,100%{transform:none}50%{transform:translateY(-3%) rotate(-2deg)}}
@keyframes leer{from{transform:rotate(-5deg)}to{transform:rotate(5deg) translateX(2%)}}
@keyframes brinco{0%,100%{transform:translateY(0)}35%{transform:translateY(-12%) rotate(4deg)}60%{transform:translateY(0) scaleY(.94)}}
@keyframes sacude{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.hola{position:relative;display:flex;align-items:flex-end;gap:10px;margin:4px 0 6px}
.hola .masc{width:96px;flex:none;animation:asomar .9s cubic-bezier(.3,1.4,.5,1) both;cursor:pointer}
@keyframes asomar{from{transform:translateX(70px) rotate(20deg);opacity:0}to{transform:none;opacity:1}}
.globo{position:relative;flex:1;min-width:0;background:var(--papel);border:2px solid var(--verde);border-radius:18px;padding:12px 14px;box-shadow:3px 3px 0 var(--verde);margin-bottom:22px;font-weight:600}
.globo::after{content:"";position:absolute;right:-11px;bottom:16px;width:16px;height:16px;background:var(--papel);border-right:2px solid var(--verde);border-bottom:2px solid var(--verde);transform:rotate(-45deg)}
.globo b{font-family:var(--display);color:var(--jit);font-size:19px;display:block}
.globo.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.9)}to{transform:none}}
.toast{display:flex;align-items:center;gap:10px;pointer-events:none}
.toast .masc{width:34px;flex:none}
.vacio .masc{width:110px;margin:0 auto 8px}
.nfc .masc{width:70px;position:absolute;right:-6px;bottom:-4px}
.visor .masc{width:90px;position:absolute;right:10px;bottom:10px}
.visor .masc.lupa{width:170px;right:50%;margin-right:-85px;bottom:56px;filter:drop-shadow(0 0 1.5px #FFF3DC) drop-shadow(0 0 1.5px #FFF3DC)}
.masc.lupa .cuerpo{animation:none}
.masc .lupa{animation:buscar 2.4s ease-in-out infinite;transform-box:view-box;transform-origin:404px 404px}
@keyframes buscar{0%,100%{transform:rotate(-10deg) translate(-30px,10px)}25%{transform:rotate(4deg) translate(0,-24px)}50%{transform:rotate(12deg) translate(20px,6px)}75%{transform:rotate(0) translate(-6px,-10px)}}
.revela{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:var(--jit);z-index:40;pointer-events:none;animation:revela .45s cubic-bezier(.65,0,.35,1) forwards;transition:opacity .45s ease}
.revela.fuera{opacity:0}
@keyframes revela{to{transform:scale(var(--s))}}
.ticket.imprime{animation:imprime .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes imprime{from{clip-path:inset(0 0 100% 0);transform:translateY(-18px)}to{clip-path:inset(0 0 -20px 0);transform:none}}
.ticket.imprime .titem{animation:renglon .35s ease-out both;animation-delay:calc(.45s + var(--i) * .07s)}
@keyframes renglon{from{opacity:0;transform:translateX(-10px)}}
/* Entrada con el logo */
.splash{position:absolute;inset:0;background:var(--crema);display:grid;place-items:center;z-index:50;animation:salir .45s ease-in 2.45s forwards}
.splash .logo{width:62%;max-width:230px}
.splash .logo svg{overflow:hidden;display:block}
.splash p{position:absolute;bottom:12%;margin:0;font:600 17px var(--display);color:var(--verde);animation:aparece .5s 1.7s both}
.splash .logo .sp-icono{display:block;width:92%;margin:0 auto;transform-origin:50% 100%;animation:spCae .65s cubic-bezier(.34,1.45,.64,1) both,spToc .6s ease-in-out .8s}
.sp-letras{display:flex;align-items:flex-end;margin-top:2%}
.sp-letra{display:block;height:auto;animation:spLetra .5s cubic-bezier(.34,1.4,.64,1) both}
@keyframes spCae{0%{transform:translateY(-60px) scale(.8);opacity:0}55%{opacity:1;transform:translateY(0) scale(1.04,.94)}75%{transform:translateY(-6px) scale(.98,1.03)}100%{transform:none;opacity:1}}
@keyframes spToc{0%,100%{transform:none}20%{transform:rotate(-3deg)}40%{transform:rotate(2.5deg)}60%{transform:rotate(-1.5deg)}80%{transform:rotate(1deg)}}
@keyframes spLetra{from{transform:translateY(30px);opacity:0}}
@keyframes entra{0%{transform:scale(.3) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes aparece{from{opacity:0;transform:translateY(8px)}}
@keyframes salir{to{opacity:0;visibility:hidden}}
.marca svg{animation:mecer 5s ease-in-out infinite;transform-origin:50% 90%}
@keyframes mecer{0%,88%,100%{transform:none}92%{transform:rotate(-8deg)}96%{transform:rotate(6deg)}}
/* Reto, apunta rápido, caducidad */
.reto{padding:14px;border-color:var(--jit);box-shadow:3px 3px 0 var(--jit);display:flex;gap:12px;align-items:center;margin-top:6px}
.reto .masc{width:70px;flex:none}
.reto h3{color:var(--jit)}
.pasos-reto{list-style:none;margin:6px 0 10px;padding:0;font-size:14px;display:flex;flex-direction:column;gap:3px}
.pasos-reto li::before{content:"○  ";color:var(--suave);font-weight:800}
.pasos-reto li.ok{color:var(--suave);text-decoration:line-through}
.pasos-reto li.ok::before{content:"✓  ";color:var(--hoja)}
.reto .btn{width:auto;padding:9px 18px;font-size:14px}
.pronto{padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;margin-top:10px}
.pronto .linea{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.vence{color:var(--jit);font-weight:800;white-space:nowrap}
.pista{font-size:13px;color:var(--suave);margin:-6px 0 10px}
/* Deslizar */
.desliza{position:relative;overflow:hidden;border-bottom:1.5px dashed var(--linea)}
.desliza:last-child{border-bottom:0}
.desliza .fila{position:relative;background:var(--papel);touch-action:pan-y;transition:transform .2s ease;border-bottom:0;user-select:none}
.desliza .fondo{position:absolute;inset:1px 0;display:flex;align-items:center;justify-content:flex-end;padding-right:14px;font-weight:800;color:var(--papel);background:var(--jit);border-radius:10px}
.desliza.compra .fondo{background:var(--hoja)}
.aparta{color:var(--hoja);font-weight:800}
.soltar{background:none;border:0;color:var(--suave);text-decoration:underline;font:600 12px var(--texto);padding:0 0 0 4px}
/* Reacciones */
.reac{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.reac button{border:1.5px solid var(--verde);background:var(--papel);border-radius:999px;padding:3px 11px;font:700 13px var(--texto);color:var(--verde)}
.reac button[aria-pressed="true"]{background:var(--verde);color:var(--papel)}
.reacciones{font-size:13px;color:var(--hoja);font-weight:700;margin-top:2px}
.ajustes{display:flex;flex-direction:column;gap:8px;margin-top:22px}
/* Arma tu casa */
.bienvenida{position:absolute;inset:0;background:var(--crema);z-index:45;overflow-y:auto;padding:26px 22px calc(28px + env(safe-area-inset-bottom,0px))}
.bienvenida .masc{width:130px;margin:0 auto 12px}
.bienvenida h1{text-align:center}
.bienvenida .sub{text-align:center}
.bienvenida form{display:flex;flex-direction:column;gap:16px;margin-top:6px}
.bienvenida label,.bienvenida legend{display:flex;flex-direction:column;gap:6px;font-weight:800;color:var(--verde)}
.bienvenida fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.campo{border:2px solid var(--verde);border-radius:14px;padding:11px 14px;background:var(--papel);font:600 16px var(--texto);width:100%}
/* Tour */
.tour{position:absolute;inset:0;z-index:40}
.hueco{position:absolute;border-radius:22px;border:3px solid var(--mostaza);box-shadow:0 0 0 9999px rgba(31,42,36,.62);transition:all .35s ease;pointer-events:none}
.tip-tour{position:absolute;left:14px;right:14px;background:var(--papel);border:2.5px solid var(--verde);border-radius:20px;box-shadow:4px 4px 0 var(--verde);padding:14px;display:flex;gap:12px;align-items:flex-start;animation:pop .3s ease-out}
.tip-tour .masc{width:60px;flex:none}
.tip-tour h3{margin-bottom:2px}
.tip-tour p{margin:0;font-size:15px}
.tip-tour .acc{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.tip-tour .acc .btn{width:auto;padding:9px 18px;font-size:14px}
.puntos{font-size:12px;color:var(--suave);font-weight:800}
/* Festejo */
.festejo{position:absolute;inset:0;z-index:42;background:rgba(31,42,36,.55);display:grid;place-items:center;overflow:hidden}
.festejo .caja{position:relative;background:var(--crema);border:3px solid var(--verde);border-radius:26px;box-shadow:5px 5px 0 var(--verde);padding:22px;width:82%;text-align:center}
.festejo .masc{width:130px;margin:0 auto 6px}
.confeti{position:absolute;top:-24px;width:9px;height:15px;border-radius:2px;animation:cae 2.4s linear forwards}
@keyframes cae{to{transform:translateY(950px) rotate(600deg)}}

/* Transiciones entre secciones */
main.ir-der > *{animation:desdeDer .38s cubic-bezier(.2,.8,.2,1) both}
main.ir-izq > *{animation:desdeIzq .38s cubic-bezier(.2,.8,.2,1) both}
main.ir-der > *:nth-child(2),main.ir-izq > *:nth-child(2){animation-delay:.03s}
main.ir-der > *:nth-child(3),main.ir-izq > *:nth-child(3){animation-delay:.06s}
main.ir-der > *:nth-child(4),main.ir-izq > *:nth-child(4){animation-delay:.09s}
main.ir-der > *:nth-child(5),main.ir-izq > *:nth-child(5){animation-delay:.12s}
main.ir-der > *:nth-child(n+6),main.ir-izq > *:nth-child(n+6){animation-delay:.15s}
@keyframes desdeDer{from{opacity:0;transform:translateX(28px)}}
@keyframes desdeIzq{from{opacity:0;transform:translateX(-28px)}}
nav{position:relative}
.nav-ind{position:absolute;top:-2px;height:4px;border-radius:0 0 4px 4px;background:var(--jit);transition:left .35s cubic-bezier(.3,1.3,.5,1),width .35s;pointer-events:none}
nav button svg{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
nav button[aria-current="page"] svg{transform:translateY(-2px) scale(1.12)}
.btn,.mini,.tab,.iman,.reac button{transition:transform .12s ease,box-shadow .12s ease,background-color .2s}
.mini:active,.tab:active,.reac button:active{transform:scale(.94)}
.casa-tag.vivo{display:flex;align-items:center;gap:6px}
.casa-tag.vivo::before{content:"";width:8px;height:8px;border-radius:50%;background:#2FA36B;box-shadow:0 0 0 0 rgba(47,163,107,.6);animation:latido 1.8s infinite}
@keyframes latido{70%{box-shadow:0 0 0 7px rgba(47,163,107,0)}100%{box-shadow:0 0 0 0 rgba(47,163,107,0)}}

/* Ticket: pasos, consejos, revisar */
.pasos{display:flex;gap:6px;margin:2px 0 14px}
.pasos span{flex:1;text-align:center;font:800 12px var(--texto);color:var(--suave);padding:6px 4px;border-radius:999px;background:var(--papel);border:1.5px solid var(--linea)}
.pasos span.act{color:var(--papel);background:var(--verde);border-color:var(--verde)}
.consejos{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--suave)}
.consejos li::before{content:"✓ ";color:var(--hoja);font-weight:800}
.previas{display:flex;gap:6px;position:absolute;left:12px;top:12px}
.previas img{width:44px;height:58px;object-fit:cover;border-radius:6px;border:2px solid var(--crema)}
.aviso-caja{padding:16px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.aviso-caja .masc{width:96px}
.titem.duda{background:#FFF4D6;border-radius:10px;padding-left:6px;padding-right:6px;margin:2px -6px;width:calc(100% + 12px)}
.titem .x{cursor:pointer;background:none}
.revisa{font:800 10px var(--texto);font-style:normal;color:#9A5A00;background:#FFE3A3;border-radius:999px;padding:1px 7px;margin-left:4px;vertical-align:middle}
.orig{flex-basis:100%;font:400 12px var(--mono);color:#8a8a8a}
.lapiz{background:none;border:0;padding:4px;font-size:17px;color:var(--suave);min-width:30px;min-height:30px}
.titem input.editar{font:inherit;border:0;border-bottom:1.5px solid var(--verde);background:transparent;width:100%}
.quien{position:absolute;inset:0;background:var(--crema);z-index:46;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:24px}
.quien .masc{width:120px;margin:0 auto}
.quien h1,.quien .sub{text-align:center}

.visor.corto{aspect-ratio:16/10}
.top-der{display:flex;align-items:center;gap:8px}
.yo-btn{width:38px;height:38px;border-radius:50%;border:2px solid var(--verde);color:var(--papel);font:700 16px var(--display);display:grid;place-items:center;box-shadow:2px 2px 0 var(--verde);padding:0}
.yo-btn[aria-current="page"]{outline:3px solid var(--mostaza);outline-offset:2px}
.perfil-cab{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;margin:6px 0 4px}
.ava-grande{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font:700 42px var(--display);color:var(--papel);border:3px solid var(--verde);box-shadow:4px 4px 0 var(--verde);animation:pop .4s ease-out}
.en-vivo{color:#2FA36B}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats div{background:var(--papel);border:2px solid var(--verde);border-radius:16px;padding:10px 6px;text-align:center;display:flex;flex-direction:column}
.stats b{font:700 26px var(--display);color:var(--jit)}
.stats span{font-size:12px;font-weight:700;color:var(--suave);line-height:1.2}
.chips-op{display:flex;flex-wrap:wrap;gap:8px}
.op{border:2px solid var(--verde);background:var(--papel);color:var(--verde);border-radius:999px;padding:7px 14px;font:700 14px var(--texto)}
.op[aria-pressed="true"]{background:var(--verde);color:var(--papel)}
.interruptor{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1.5px dashed var(--linea);cursor:pointer;position:relative}
.interruptor:last-child{border-bottom:0}
.interruptor span{flex:1;display:flex;flex-direction:column}
.interruptor small{color:var(--suave);font-size:13px}
.interruptor input{position:absolute;opacity:0;pointer-events:none}
.interruptor i{width:48px;height:28px;border-radius:999px;background:var(--linea);position:relative;transition:background .2s;flex:none}
.interruptor i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.interruptor input:checked + i{background:var(--hoja)}
.interruptor input:checked + i::after{transform:translateX(20px)}
.interruptor input:focus-visible + i{outline:3px solid var(--mostaza);outline-offset:2px}
.mazo{position:relative;height:440px;margin-top:14px}
main.lleno{display:flex;flex-direction:column}
main.lleno > *{flex:none}
main.lleno .con-chef{min-height:62px}
main.lleno .con-chef .masc{width:44px;top:0}
main.lleno .tabs{margin:6px 0 8px!important}
main.lleno .mazo{flex:1 1 auto;height:auto;min-height:250px;margin-top:6px}
main.lleno .carta{padding:12px 14px;gap:4px}
main.lleno .carta-ilu{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;margin:0;overflow:hidden}
main.lleno .carta-ilu svg{width:clamp(110px,24vh,180px);height:clamp(110px,24vh,180px);flex:none;transform-origin:50% 50%}
main.lleno .carta h2{font-size:22px;line-height:1.1}
main.lleno .mazo-acc{margin-top:16px}
main.lleno .voto{width:58px;height:58px}
main.lleno .voto.ver{width:48px;height:48px}
.pista-mazo{text-align:center;margin:8px 0 0}
.atajos{display:flex;gap:8px;flex-wrap:wrap}
.atajo{border:2px solid var(--jit);background:var(--jit);color:#fff;border-radius:999px;padding:7px 14px;font:700 14px var(--texto);box-shadow:2px 2px 0 var(--verde)}
.atajo.claro{background:var(--papel);color:var(--jit)}
.atajo[disabled]{opacity:.6}
.carta{position:absolute;inset:0;background:var(--papel);border:2.5px solid var(--verde);border-radius:24px;box-shadow:4px 4px 0 var(--verde);padding:16px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;touch-action:pan-y;user-select:none;cursor:grab;transform:translateY(calc(var(--pos) * 12px)) scale(calc(1 - var(--pos) * .05));transition:transform .3s ease;--si:0;--no:0}
.carta .chips{justify-content:center}
.carta-ilu{margin:4px 0 2px}
.carta-ilu .platillo{animation:girar .6s cubic-bezier(.3,1.4,.5,1) both}
.mazo.quieto .platillo{animation:none}
.mazo.quieto .carta:first-child{animation:cartaNueva .35s ease-out both}
@keyframes cartaNueva{from{opacity:0}}
.carta{will-change:transform}
.carta h2{font-size:24px}
.sello{position:absolute;top:22px;font:700 18px var(--display);padding:4px 10px;border:3px solid;border-radius:10px;pointer-events:none;background:var(--papel)}
.sello.si{left:14px;color:#2FA36B;transform:rotate(-14deg);opacity:var(--si)}
.sello.no{right:14px;color:var(--jit);transform:rotate(14deg);opacity:var(--no)}
.le-gusta{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;color:var(--hoja);margin-top:auto}
.le-gusta i,.caritas i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--papel);font:700 12px var(--display);font-style:normal;border:2px solid var(--papel)}
.mazo-acc{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:24px}
.voto{width:64px;height:64px;border-radius:50%;border:2.5px solid var(--verde);font:700 26px var(--display);display:grid;place-items:center;box-shadow:3px 3px 0 var(--verde);transition:transform .15s cubic-bezier(.3,1.6,.5,1);padding:0}
.voto:active{transform:scale(.88)}
.voto.no{background:var(--papel);color:var(--jit)}
.voto.si{background:var(--jit);color:var(--papel)}
.voto.ver{width:52px;height:52px;font-size:15px;background:var(--crema);color:var(--verde)}
.antojo{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%}
.nom-a{font:700 17px var(--display);color:var(--verde)}
.match-tag{font:800 11px var(--texto);font-style:normal;background:var(--jit);color:var(--papel);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.caritas{display:flex;padding-left:6px}
.caritas i{margin-left:-6px}
.match-ilu{position:relative;display:flex;justify-content:center;margin-bottom:6px}
.match-ilu .masc{position:absolute;width:70px;right:6%;bottom:-6px}
.hechas{padding:14px;display:flex;flex-direction:column;gap:10px;border-color:var(--jit);box-shadow:3px 3px 0 var(--jit)}
.pensando{display:flex;align-items:center;gap:12px;font-weight:700;color:var(--verde)}
.pensando .masc{width:60px;flex:none}
.pensando p{margin:0}
.receta.nueva{animation:pop .4s ease-out both}
/* En casa ahora + comida rescatada */
.en-casa{padding:14px;margin-top:14px;display:flex;flex-direction:column;gap:12px}
.cab-ec{display:flex;justify-content:space-between;align-items:baseline}
.cab-ec b{font:700 18px var(--display);color:var(--verde)}
.cab-ec span{font-weight:800;font-size:13px;color:var(--suave)}
.gente{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px}
.persona{display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:700;font-size:13px;min-width:58px;opacity:.45;transition:opacity .3s}
.persona.dentro{opacity:1}
.persona i{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:700 18px var(--display);font-style:normal;color:var(--papel);border:2.5px solid var(--verde);filter:grayscale(1);transition:filter .3s}
.persona.dentro i{filter:none;box-shadow:0 0 0 3px #2FA36B55}
.persona small{font-size:11px;color:var(--suave)}
.persona.dentro small{color:#2FA36B}
.ahorro{padding:14px;margin-top:10px;display:flex;align-items:center;gap:12px}
.ahorro .masc{width:66px;flex:none}
/* Recetas con ilustración */
.receta.con-ilu{flex-direction:row;align-items:center;gap:12px}
.receta.con-ilu .platillo{flex:none;transition:transform .4s cubic-bezier(.3,1.5,.5,1)}
@media (hover:hover){.receta.con-ilu:hover .platillo{transform:rotate(-12deg) scale(1.05)}}
.cuerpo-r{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.meta-r{font-size:13px;color:var(--suave);font-weight:600}
.ilu-grande{display:grid;place-items:center;margin-top:-4px}
.ilu-grande .platillo{animation:girar .7s cubic-bezier(.3,1.4,.5,1) both}
@keyframes girar{from{transform:rotate(-90deg) scale(.6);opacity:0}}
.insignias{display:flex;justify-content:center;flex-wrap:wrap;gap:6px}
.insignias span{font:700 13px var(--texto);background:var(--papel);border:1.5px solid var(--verde);color:var(--verde);border-radius:999px;padding:4px 12px}
.ingr{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ingr li{display:flex;align-items:center;gap:10px;background:var(--papel);border-radius:12px;padding:8px 12px;font-weight:600}
.ingr li span:nth-child(2){flex:1}
.ingr small{font-weight:800;font-size:12px}
.ingr li.si small{color:var(--hoja)} .ingr li.no small{color:var(--jit)}
.marca-i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;background:var(--hoja);color:var(--papel)}
.ingr li.no .marca-i{background:var(--jit)}
.pasos-r{counter-reset:p;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.pasos-r li{counter-increment:p;display:flex;gap:12px;align-items:flex-start;line-height:1.45}
.pasos-r li::before{content:counter(p);flex:none;width:28px;height:28px;border-radius:50%;background:var(--verde);color:var(--papel);display:grid;place-items:center;font:700 14px var(--display)}
.cocinar-arriba{width:100%;margin-top:14px;animation:latidoBtn 2.4s ease-in-out 1s infinite}
@keyframes latidoBtn{0%,80%,100%{transform:none}88%{transform:scale(1.03)}}
.truco{margin-top:14px;background:#FFF0C8;border-radius:14px;padding:12px 14px;font-size:15px;border:2px dashed var(--mostaza)}
.truco b{display:block;font-family:var(--display);color:#9A5A00;margin-bottom:2px}
.cocina{position:absolute;inset:0;z-index:44;background:var(--crema);display:flex;flex-direction:column;padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:aparece .3s ease-out}
.cocina-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--display);color:var(--verde)}
.barra{height:8px;background:var(--linea);border-radius:999px;margin:12px 0 4px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--jit);border-radius:999px;transition:width .4s ease}
.cocina-ilu{display:grid;place-items:center;margin:14px 0 4px}
.cocina-ilu .platillo{animation:girar .6s cubic-bezier(.3,1.4,.5,1) both}
.cocina .cocina-ilu{flex:1;min-height:0;align-content:center}
.escena-paso{width:100%;max-width:420px;max-height:100%;height:auto;display:block;animation:escenaEntra .45s cubic-bezier(.22,1,.36,1) both}
@keyframes escenaEntra{from{opacity:0;transform:translateY(14px) scale(.97)}}
.accion-chip{display:inline-block;background:var(--jit);color:#fff;border-radius:999px;padding:1px 10px;font:700 13px var(--texto);vertical-align:2px}
.escena-paso *{transform-box:fill-box}
.ep-chef{animation:epBob 1.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes epBob{50%{transform:translateY(-4px) rotate(-1.5deg)}}
.ep-licuar .ep-chef,.ep-batir .ep-chef{animation-duration:.5s}
.ep-servir .ep-chef{animation:epHop .9s cubic-bezier(.3,1.5,.5,1) infinite}
@keyframes epHop{40%{transform:translateY(-10px)}}
.ep-llama{transform-origin:50% 100%;animation:epLlama .45s ease-in-out infinite alternate}
@keyframes epLlama{to{transform:scaleY(1.25) scaleX(.85)}}
.ep-cuchillo{transform-origin:100% 50%;animation:epCorta .55s ease-in-out infinite}
@keyframes epCorta{0%,100%{transform:rotate(-16deg)}45%{transform:rotate(4deg)}}
.ep-pieza{transform-origin:50% 100%;animation:epPieza 1.1s ease-in-out infinite}
@keyframes epPieza{0%,100%{transform:none}50%{transform:translateY(-5px) rotate(12deg)}}
.ep-tiembla{animation:epTiembla .12s linear infinite}
@keyframes epTiembla{50%{transform:translateX(2.5px) rotate(.6deg)}}
.ep-remolino{transform-origin:50% 50%;animation:epGira .5s linear infinite}
@keyframes epGira{to{transform:rotate(360deg)}}
.ep-batidor{transform-origin:50% 0;animation:epBatidor .4s ease-in-out infinite alternate}
@keyframes epBatidor{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.ep-gota{animation:epGota 1s ease-out infinite}
@keyframes epGota{0%{transform:none;opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.ep-salta rect{transform-origin:50% 100%;animation:epSalta .5s ease-in-out infinite alternate}
.ep-salta rect:nth-child(2n){animation-delay:.2s}
@keyframes epSalta{to{transform:translateY(-8px) rotate(-10deg)}}
.ep-chisporrotea{animation:epVapor 1.1s ease-out infinite}
.ep-burbuja{animation:epBurbuja 1.4s ease-in infinite}
@keyframes epBurbuja{0%{transform:translateY(10px) scale(.4);opacity:0}30%{opacity:1}100%{transform:translateY(-26px) scale(1);opacity:0}}
.ep-vapor{animation:epVapor 2s ease-out infinite}
@keyframes epVapor{0%{transform:translateY(8px);opacity:0}40%{opacity:.55}100%{transform:translateY(-22px);opacity:0}}
.ep-voltea{transform-origin:50% 50%;animation:epVoltea 1.8s cubic-bezier(.45,0,.55,1) infinite}
@keyframes epVoltea{0%,55%,100%{transform:none}70%{transform:translateY(-40px) scaleY(-1)}85%{transform:translateY(-6px) scaleY(1)}}
.ep-sube{transform-origin:50% 100%;animation:epSube .9s cubic-bezier(.3,1.5,.5,1) both}
@keyframes epSube{from{transform:translateY(-60px) scale(.6);opacity:0}}
.ep-brillo{transform-origin:50% 50%;animation:epBrillo 1.2s ease-in-out infinite}
@keyframes epBrillo{0%,100%{transform:scale(.3);opacity:0}50%{transform:scale(1) rotate(45deg);opacity:1}}
.ep-salero{transform-origin:50% 100%;animation:epSalero .5s ease-in-out infinite}
@keyframes epSalero{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(8deg) translateY(8px)}}
.ep-grano{animation:epGrano .7s ease-in infinite}
@keyframes epGrano{0%{transform:none;opacity:0}20%{opacity:1}100%{transform:translateY(36px);opacity:0}}
.ep-brasa{animation:epBrasa 1.4s ease-in-out infinite alternate}
@keyframes epBrasa{to{opacity:.65}}
.ep-manecilla{transform-origin:50% 100%;animation:epGira 3s steps(12) infinite}
.ep-cuchara{transform-origin:20% 0;animation:epBatidor .7s ease-in-out infinite alternate}
.paso-txt{animation:pasoEntra .35s cubic-bezier(.22,1,.36,1) both}
.cocina[data-dir="adelante"] .escena-paso{animation:pasoDer .4s cubic-bezier(.22,1,.36,1) both}
.cocina[data-dir="atras"] .escena-paso{animation:pasoIzq .4s cubic-bezier(.22,1,.36,1) both}
.cocina[data-dir="atras"] .paso-txt{animation-name:pasoEntraIzq}
@keyframes pasoDer{from{opacity:0;transform:translateX(36px)}}
@keyframes pasoIzq{from{opacity:0;transform:translateX(-36px)}}
@keyframes pasoEntra{from{opacity:0;transform:translateX(20px)}}
@keyframes pasoEntraIzq{from{opacity:0;transform:translateX(-20px)}}
.cocina .barra i{transition:width .4s cubic-bezier(.22,1,.36,1)}
.paso-num{font:700 15px var(--display);color:var(--jit);margin:8px 0 4px;text-align:center}
.paso-txt{font:600 24px/1.35 var(--display);color:var(--verde);text-align:center;margin:0;flex:1;animation:aparece .35s ease-out}
.cocina-acc{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:14px}
/* Selector de estilo */
.estilos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.estilo-op{border:2px solid var(--linea);background:var(--papel);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font:800 13px var(--texto);color:var(--verde)}
.estilo-op[aria-pressed="true"]{border-color:var(--verde);background:var(--crema)}
.estilo-op i{display:block;width:46px;height:18px;border-radius:999px;background:var(--jit)}
.estilo-op[data-e="calco"] i{border:2px solid var(--verde);box-shadow:2px 2px 0 var(--verde)}
.estilo-op[data-e="suave"] i{box-shadow:0 4px 10px rgba(209,71,38,.35);border-radius:8px}
.estilo-op[data-e="pop"] i{border:3px solid var(--tinta);box-shadow:3px 3px 0 var(--tinta);background:var(--mostaza)}

/* Estilo 2: Suave — sin contornos, sombras difusas, esquinas más redondas */
[data-estilo="suave"]{--fondo:#EDE6DA}
[data-estilo="suave"] .tel{border:0!important;box-shadow:0 24px 60px rgba(38,79,58,.25)!important}
[data-estilo="suave"] .sticker{border:0;box-shadow:0 8px 22px rgba(38,79,58,.12);border-radius:22px}
[data-estilo="suave"] .btn{border:0;border-radius:16px;box-shadow:0 8px 18px rgba(209,71,38,.3)}
[data-estilo="suave"] .btn.verde{box-shadow:0 8px 18px rgba(38,79,58,.3)}
[data-estilo="suave"] .btn.claro{box-shadow:0 6px 16px rgba(38,79,58,.12)}
[data-estilo="suave"] .btn:active{transform:scale(.96);box-shadow:0 3px 8px rgba(0,0,0,.15)}
[data-estilo="suave"] .iman .disco{border:0;box-shadow:0 12px 24px rgba(0,0,0,.18)}
[data-estilo="suave"] .iman .disco::after{border-style:solid;border-color:rgba(255,251,242,.35)}
@media (hover:hover){[data-estilo="suave"] .iman:hover .disco{transform:translateY(-3px)}}
[data-estilo="suave"] nav{border-top:0;box-shadow:0 -8px 24px rgba(38,79,58,.08)}
[data-estilo="suave"] nav .centro .bola{border:0;box-shadow:0 8px 18px rgba(209,71,38,.4)}
[data-estilo="suave"] .mini,[data-estilo="suave"] .tab,[data-estilo="suave"] .reac button{border:0;background:#F1E6D2}
[data-estilo="suave"] .tab[aria-selected="true"],[data-estilo="suave"] .reac button[aria-pressed="true"]{background:var(--verde)}
[data-estilo="suave"] .mini.rojo{background:var(--jit)}
[data-estilo="suave"] .globo,[data-estilo="suave"] .tip-tour,[data-estilo="suave"] .caja{border:0;box-shadow:0 10px 26px rgba(38,79,58,.16)}
[data-estilo="suave"] .globo::after{border:0}
[data-estilo="suave"] .agregar input,[data-estilo="suave"] .campo{border:0;box-shadow:inset 0 0 0 1.5px var(--linea)}
[data-estilo="suave"] main.ir-der > *,[data-estilo="suave"] main.ir-izq > *{animation-name:subeSuave;animation-duration:.45s}
@keyframes subeSuave{from{opacity:0;transform:translateY(14px)}}
[data-estilo="suave"] .nav-ind{height:5px;width:22px!important;border-radius:999px;top:auto;bottom:4px;background:var(--verde)}

/* Estilo 3: Pop — bordes gruesos, mostaza, botones que rebotan */
[data-estilo="pop"]{--crema:#FFF1C9;--papel:#FFFDF5;--fondo:#F2B134;--linea:#E8D49A}
[data-estilo="pop"] .sticker{border:3px solid var(--tinta);box-shadow:5px 5px 0 var(--tinta);border-radius:14px}
[data-estilo="pop"] .dos > .sticker:nth-child(odd){transform:rotate(-1.2deg)}
[data-estilo="pop"] .dos > .sticker:nth-child(even){transform:rotate(1.2deg)}
[data-estilo="pop"] .btn{border:3px solid var(--tinta);border-radius:12px;box-shadow:5px 5px 0 var(--tinta);font-weight:800;letter-spacing:.2px}
[data-estilo="pop"] .btn:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--tinta)}
[data-estilo="pop"] .btn.claro{background:var(--mostaza);color:var(--tinta)}
[data-estilo="pop"] .iman .disco{border:3px solid var(--tinta);box-shadow:5px 5px 0 var(--tinta);transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
@media (hover:hover){[data-estilo="pop"] .iman:hover .disco{transform:rotate(-8deg) scale(1.05)}}
[data-estilo="pop"] .iman:focus-visible .disco{transform:rotate(-8deg) scale(1.05)}
[data-estilo="pop"] .iman:active .disco{transform:scale(.88) rotate(6deg)}
[data-estilo="pop"] nav{border-top:3px solid var(--tinta)}
[data-estilo="pop"] nav .centro .bola{border:3px solid var(--tinta);box-shadow:4px 4px 0 var(--tinta)}
[data-estilo="pop"] .mini,[data-estilo="pop"] .tab,[data-estilo="pop"] .reac button{border:2.5px solid var(--tinta)}
[data-estilo="pop"] .tab[aria-selected="true"]{background:var(--tinta)}
[data-estilo="pop"] .globo,[data-estilo="pop"] .tip-tour,[data-estilo="pop"] .caja{border:3px solid var(--tinta);box-shadow:5px 5px 0 var(--tinta)}
[data-estilo="pop"] .globo::after{border-color:var(--tinta);border-width:3px}
[data-estilo="pop"] .agregar input,[data-estilo="pop"] .campo{border:3px solid var(--tinta)}
[data-estilo="pop"] main.ir-der > *,[data-estilo="pop"] main.ir-izq > *{animation-name:rebota;animation-duration:.5s;animation-timing-function:cubic-bezier(.3,1.6,.5,1)}
@keyframes rebota{from{opacity:0;transform:scale(.9) translateY(10px)}}
[data-estilo="pop"] .nav-ind{background:var(--tinta);height:6px}
@media (prefers-reduced-motion:reduce){main.ir-der > *,main.ir-izq > *{animation-duration:.2s!important}}
</style>

const PROMPT = n => `Lee ${n > 1 ? `estas ${n} imágenes. Son partes seguidas del MISMO ticket, de arriba hacia abajo, con un poco de traslape entre una y otra: no repitas renglones` : 'esta foto'} de un ticket de compra de supermercado o tienda en México.

Reglas:
- Usa SOLO lo que se lee en la imagen. No inventes productos, cantidades ni precios. Si un dato no se lee, pon null.
- Incluye solo productos comprados. No incluyas subtotal, total, IVA, descuentos, cambio, forma de pago, puntos, bolsas ni propinas.
- Si un renglón se lee a medias, inclúyelo con "seguro": false.
- "nombre": nombre corto y claro en español, con mayúscula inicial. Ejemplos: "LECHE LALA ENT 1LT" → "Leche"; "JITOMATE SALADET KG" → "Jitomate"; "PAN BIMBO BCO GDE" → "Pan de caja".
- "texto_original": el renglón tal cual aparece en el ticket.
- "cantidad": como aparece (por ejemplo "1 kg", "2 pzas", "0.750 kg") o null.
- "precio": importe de ese renglón en pesos, como número, o null.
- "categoria": "refri" (lácteos, carnes, huevo, embutidos, refrigerados), "verdura" (frutas y verduras) o "alacena" (todo lo demás).
- "clave": si el producto es uno de estos, escribe la clave exacta; si no, null: ${CLAVES.join(', ')}.
- Si la imagen no es un ticket de compra, responde "es_ticket": false y "productos": [].

Responde solo con JSON con esta forma:
{"es_ticket": true, "tienda": "nombre o null", "fecha": "dd/mm/aaaa o null", "total": 123.45, "productos": [{"nombre": "Leche", "texto_original": "LECHE LALA 1L", "cantidad": "1 L", "precio": 29.5, "categoria": "refri", "clave": "leche", "seguro": true}]}`;

// Un ticket largo se parte en pedazos para que la letra chica se siga leyendo
async function prepararImagenes(files, max) {
  const out = [];
  for (const f of files) {
    if (out.length >= max) break;
    let bmp; try { bmp = await createImageBitmap(f, {imageOrientation:'from-image'}); } catch (e) { out.push(f); continue; }
    const w = bmp.width, h = bmp.height, ratio = h / w;
    const piezas = Math.max(1, Math.min(max - out.length, ratio > 2.2 ? Math.ceil(ratio / 1.6) : 1));
    const alto = h / piezas, solape = piezas > 1 ? alto * 0.08 : 0;
    for (let i = 0; i < piezas; i++) {
      const y0 = Math.max(0, i * alto - solape), y1 = Math.min(h, (i + 1) * alto + solape);
      const esc2 = Math.min(1, 2000 / Math.max(w, y1 - y0));
      const cv = document.createElement('canvas'); cv.width = Math.round(w * esc2); cv.height = Math.round((y1 - y0) * esc2);
      cv.getContext('2d').drawImage(bmp, 0, y0, w, y1 - y0, 0, 0, cv.width, cv.height);
      out.push(await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.9)));
    }
  }
  return out;
}
function convertir(p) {

  const clave = CLAVES.includes(p.clave) ? p.clave : (CLAVES.includes(slug(n)) ? slug(n) : null);
  return { id: clave || slug(n), n, q: String(p.cantidad ?? '').trim() || '1',
    c: ['refri', 'verdura', 'alacena'].includes(p.categoria) ? p.categoria : 'alacena',
    p: num(p.precio), on: true, duda: p.seguro === false, orig: String(p.texto_original ?? '').trim() };
}
function mensajeError(e) {
  const c = e && e.code;
  if (c === 'not_granted' || c === 'sampling_disabled') return 'Sin permiso para usar Claude no puedo leer la foto. Puedes escribir la lista a mano.';
  if (c === 'rate_limited') return 'Fueron muchas lecturas seguidas. Espera un momento y vuelve a intentar.';
  if (c === 'image_rejected') return 'Esa imagen no se pudo usar. Prueba con otra foto.';
  if (c === 'session_expired') return 'Tu sesión de Claude caducó. Vuelve a entrar e intenta otra vez.';
  return 'No me salió bien la lectura. Intenta otra vez con buena luz y el ticket completo.';
}
async function leerFotos(files) {
  if (!files || !files.length) return;
  const ctl = new AbortController();
  sub = {leyendo:true, previas:[...files].slice(0, 4).map(f => URL.createObjectURL(f)), ctl}; render();
  try {
    const imgs = await prepararImagenes([...files], IMG.maxCount);
    const res = await SAMPLE.json(PROMPT(imgs.length), {images:imgs, modelTier:'default', effort:'low', signal:ctl.signal});
    const prods = Array.isArray(res && res.productos) ? res.productos.map(convertir).filter(Boolean) : [];
    if (res && res.es_ticket === false) { sub = {error:'Esa foto no parece un ticket de compra. Intenta otra vez con el ticket completo y buena luz.'}; return render(); }
    if (!prods.length) { sub = {error:'No encontré productos en esa foto. Acércate un poco más y que no salga borrosa.'}; return render(); }
    sub = {paso:'ticket', fuente:'ia', tienda:res.tienda, fecha:res.fecha, total:num(res.total), items:prods};
    vibrar([20, 40, 20]); render();
  } catch (e) {
    if (e && e.code === 'cancelled') { sub = {}; return render(); }

  }
}

// Animación: el ticket vuela, el refri abre la puerta, se lo traga y la cierra (todo con transform/opacity para que vaya fluido)
function alRefri(n, listo) {
  const app = $('#app'), tk = document.querySelector('#vista .ticket'), $ok = $('#ok');
  if (!tk || !app.animate) return listo();
  if ($ok) $ok.disabled = true;
  const ra = app.getBoundingClientRect(), rt = tk.getBoundingClientRect();
  const capa = document.createElement('div'); capa.className = 'al-refri';
  capa.innerHTML = `<div class="ra-escena"><div class="ra-refri"><div class="ra-dentro"><i class="ra-foco"></i><i class="ra-rep"></i><i class="ra-rep b"></i><i class="ra-cajon"></i></div>
      <div class="ra-puerta"><i class="ra-jal"></i><i class="ra-jal b"></i></div></div></div>
    <p class="guardado">¡Guardado en el refri!<small>${n} cosa${n === 1 ? '' : 's'} nuevas</small></p>`;
  app.appendChild(capa);
  const clon = tk.cloneNode(true); clon.classList.remove('imprime'); clon.classList.add('ticket-vuela');
  clon.style.cssText = `left:${rt.left - ra.left}px;top:${rt.top - ra.top}px;width:${rt.width}px;height:${rt.height}px`;
  app.appendChild(clon); tk.style.visibility = 'hidden';
  const fr = capa.querySelector('.ra-refri'), rf = fr.getBoundingClientRect(), puerta = capa.querySelector('.ra-puerta');
  const cx = rf.left + rf.width / 2 - (rt.left + rt.width / 2), cy = rf.top + rf.height * .42 - (rt.top + rt.height / 2);
  const s = Math.min(.9, (rf.width * .5) / rt.width, (rf.height * .45) / rt.height);
  const sale = 'cubic-bezier(.22,1,.36,1)', resorte = 'cubic-bezier(.34,1.56,.64,1)';
  capa.animate([{opacity:0}, {opacity:1}], {duration:280, easing:'ease-out', fill:'forwards'});
  fr.animate([{transform:'translateY(60px) scale(.7)', opacity:0}, {transform:'none', opacity:1}], {duration:520, easing:resorte, fill:'both'});
  puerta.animate([{transform:'rotateY(0)'}, {transform:'rotateY(-108deg)'}], {duration:480, delay:320, easing:sale, fill:'forwards'});
  clon.animate([
      {transform:'translate(0,0) scale(1) rotate(0)', opacity:1, easing:'cubic-bezier(.3,0,.2,1)'},
      {transform:`translate(${cx * .35}px, ${cy * .35 - 70}px) scale(${.45 + s * .4}) rotate(-5deg)`, opacity:1, offset:.45, easing:'cubic-bezier(.4,0,.6,1)'},
      {transform:`translate(${cx * .9}px, ${cy * .85}px) scale(${s * 1.15}) rotate(3deg)`, opacity:1, offset:.82, easing:'ease-in'},
      {transform:`translate(${cx}px, ${cy + 8}px) scale(${s * .6}) rotate(0)`, opacity:0}],
    {duration:900, delay:420, fill:'forwards'});
  if (typeof sonido === 'function') setTimeout(() => sonido('pop'), 1250);
  puerta.animate([{transform:'rotateY(-108deg)'}, {transform:'rotateY(0)'}], {duration:520, delay:1320, easing:resorte, fill:'forwards'});
  fr.animate([{transform:'none'}, {transform:'scale(1.05,.95)', offset:.4}, {transform:'scale(.98,1.02)', offset:.75}, {transform:'none'}], {duration:420, delay:1560, easing:'ease-out'});
  setTimeout(() => { vibrar([20, 40, 20]); capa.querySelector('.guardado').classList.add('ver'); }, 1620);
  setTimeout(() => {
    listo(); app.appendChild(capa);
    capa.animate([{opacity:1}, {opacity:0}], {duration:380, easing:'ease-in-out', fill:'forwards'}).onfinish = () => { capa.remove(); clon.remove(); };
    clon.remove();
  }, 2450);
}

function activarMazo() {
  const cartas = [...document.querySelectorAll('#mazo .carta')], top = cartas[cartas.length - 1]; if (!top) return;
  let ocupado = false, arrastro = false;
  const volar = dir => {
    if (ocupado) return; ocupado = true;
    top.style.transition = 'transform .35s ease, opacity .35s';
    top.style.transform = `translate(${dir * 130}%, -20px) rotate(${dir * 24}deg)`; top.style.opacity = '0';
    document.querySelectorAll('.mazo-acc button').forEach(b => b.disabled = true);
    cartas.slice(0, -1).forEach(c => c.style.setProperty('--pos', Math.max(0, +getComputedStyle(c).getPropertyValue('--pos') - 1)));
    vibrar(dir > 0 ? [15, 30, 15] : 12);
    setTimeout(() => votar(top.dataset.id, dir), 300);
  };

    top.style.transition = 'transform .3s cubic-bezier(.3,1.5,.5,1)'; top.style.transform = '';

  };
  let x0 = null, y0 = 0, dx = 0, mover = false;
  top.addEventListener('pointerdown', e => { if (ocupado) return; x0 = e.clientX; y0 = e.clientY; dx = 0; mover = false; arrastro = false; });
  top.addEventListener('pointermove', e => {
    if (x0 === null) return;
    const mx = e.clientX - x0, my = e.clientY - y0;
    if (!mover) {
      if (Math.abs(mx) < 10 && Math.abs(my) < 10) return;
      if (Math.abs(my) > Math.abs(mx)) { x0 = null; arrastro = true; return; }   // es scroll, no toque
      mover = true; arrastro = true; top.setPointerCapture(e.pointerId); top.style.transition = 'none';
    }
    dx = mx;
    top.style.transform = `translateX(${dx}px) rotate(${dx / 14}deg)`;
    top.style.setProperty('--si', Math.max(0, Math.min(1, dx / 100)));
    top.style.setProperty('--no', Math.max(0, Math.min(1, -dx / 100)));
  });
  top.addEventListener('pointerup', () => {
    if (x0 === null) return; x0 = null;
    if (mover && Math.abs(dx) > 100) return volar(dx > 0 ? 1 : -1);
    if (mover) regresar();
  });
  top.addEventListener('pointercancel', () => { x0 = null; if (mover) regresar(); arrastro = true; });
  top.addEventListener('click', () => { if (!arrastro && !ocupado) abrirReceta(top.dataset.id); arrastro = false; });
  $('#vNo').onclick = () => volar(-1);
  $('#vSi').onclick = () => volar(1);
  $('#vVer').onclick = () => { if (!ocupado) abrirReceta(top.dataset.id); };
}

// ---------- Modo cocina: un paso a la vez, letra grande ----------
function cocinar(i, k) {
  const r = receta(i), n = r.p.length, ult = k === n - 1;
  // Si ya está abierto el modo cocina, solo cambia el contenido (sin volver a armar la pantalla, así no parpadea)
  const previo = $('#capa .cocina'), dir = previo && +previo.dataset.paso > k ? 'atras' : 'adelante';
  const html = `
    <div class="cocina-top"><button class="link" id="cSalir" style="padding:0">Salir</button><b>${esc(r.n)}</b><span class="puntos">${k + 1} de ${n}</span></div>
    <div class="barra"><i style="width:${(k + 1) / n * 100}%"></i></div>
    <div class="cocina-ilu">${escenaPaso(r.p[k])}</div>
    <p class="paso-num">Paso ${k + 1} · <span class="accion-chip">${accionDe(r.p[k])[2]}</span></p>
    <p class="paso-txt" id="pasoTxt">${esc(r.p[k])}</p>
    ${ult ? `<div class="truco"><b>Truco</b>${esc(r.truco)}</div>` : ''}
    <div class="cocina-acc">
      <button class="btn claro" id="cAtras" ${k === 0 ? 'disabled style="opacity:.4"' : ''}>Atrás</button>
      <button class="btn ${ult ? 'verde' : ''}" id="cSig">${ult ? '¡Listo! Avisar que está la cena' : 'Siguiente'}</button>
    </div>`;
  if (previo) { previo.innerHTML = html; previo.dataset.paso = k; previo.dataset.dir = dir; }
  else $('#capa').innerHTML = `<div class="cocina" role="dialog" aria-label="Cocinar ${esc(r.n)}" data-paso="${k}">${html}</div>`;
  vibrar(10);
  $('#cSalir').onclick = () => abrirReceta(i);
  if (k > 0) $('#cAtras').onclick = () => cocinar(i, k - 1);
  $('#cSig').onclick = () => {
    if (!ult) return cocinar(i, k + 1);
    const salvados = S.items.filter(it => r.i.includes(it.id) && it.hay && restan(it) >= 0 && restan(it) <= 3);
    sumar('cocinadas'); salvados.forEach(it => { rescatar(it); it.ts = ahora() - (DIAS[it.id] ?? 14) * DIA * 0.2; });
    $('#capa').innerHTML = ''; avisar('La cena está lista', 'mesa'); vibrar([30, 60, 30]);
    toast(salvados.length ? `¡Provecho! Rescataste ${salvados.map(it => it.n.toLowerCase()).join(' y ')} antes de que se echara a perder` : `¡Provecho! Avisé que ya está ${r.n.toLowerCase()}`, 'fiesta'); render();
  };
}

  if (!editar) { S = inicial({ nombre:'Casa Hermosillo', yo:'Tú', roomies:['Chuy','Lupita','Beto'] }); L.soy = 'Tú'; guardarL(); guardar(); $('#capa').innerHTML = ''; ir('casa'); return; }
  const c = editar ? S.casa : {nombre:'Casa Roma', yo:'', roomies:['Dani','Sofi','Leo']};
  const r = [...c.roomies, '', '', ''].slice(0, 3);

      <fieldset><legend>¿Con quién vives? (hasta 3)</legend>

      </fieldset>

      ${editar ? '<button type="button" class="link" id="ccancel">Cancelar</button>' : ''}
    </form></div>`;
  if (editar) $('#ccancel').onclick = () => $('#capa').innerHTML = '';
  $('#fcasa').onsubmit = e => {
    e.preventDefault();
    const casa = { nombre:$('#cnom').value.trim() || 'Mi casa', yo:$('#cyo').value.trim(),
      roomies:[...new Set([0,1,2].map(k => $('#r' + k).value.trim()).filter(Boolean))] };
    if (editar) {
      const viejos = miembros(), nuevos = [casa.yo || 'Yo', ...casa.roomies];
      viejos.forEach((v, k) => { const n = nuevos[k]; if (!n || n === v) return;
        S.avisos.forEach(a => { if (a.q === v) a.q = n; if (a.r && a.r[v]) { a.r[n] = a.r[v]; delete a.r[v]; } });

    } else {
      S = inicial(casa); L.soy = casa.yo || 'Yo'; guardarL(); guardar();
      $('#capa').innerHTML = ''; ir('casa');
    }
  };
}

// ---------- Deslizar para marcar ----------
function activarDeslizar(el) {
  el.querySelectorAll('.desliza').forEach(w => {
    const f = w.querySelector('.fila'); let x0 = null, y0 = 0, dx = 0, mover = false;
    f.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; x0 = e.clientX; y0 = e.clientY; dx = 0; mover = false; });
    f.addEventListener('pointermove', e => {
      if (x0 === null) return;
      if (!mover) { if (Math.abs(e.clientX - x0) < 8) return; if (Math.abs(e.clientY - y0) > Math.abs(e.clientX - x0)) { x0 = null; return; } mover = true; f.setPointerCapture(e.pointerId); f.style.transition = 'none'; }
      dx = Math.min(0, e.clientX - x0); f.style.transform = `translateX(${dx}px)`;
    });
    const fin = () => {
      if (x0 === null) return; x0 = null; f.style.transition = '';
      if (mover && dx < -90) { f.style.transform = 'translateX(-110%)'; vibrar(20); setTimeout(() => toggleItem(w.dataset.id), 180); }
      else f.style.transform = '';
    };
    f.addEventListener('pointerup', fin);
    f.addEventListener('pointercancel', () => { x0 = null; f.style.transition = ''; f.style.transform = ''; });
  });
}
